<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e; color: #eee; display: flex; justify-content: center;
}
.app {
  width: 100%; max-width: 620px; background: #2d2d44; border-radius: 10px;
  overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.titlebar {
  background: #3d3d5c; padding: 8px 14px; display: flex; align-items: center; gap: 8px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #ff5f57; } .dot.y { background: #ffbd2e; } .dot.g { background: #28ca42; }
.titlebar span { margin-left: 8px; font-size: 12px; color: #999; }
.instructions {
  padding: 10px 16px; background: #252540; font-size: 13px; color: #aaa;
}
.instructions b { color: #62c4ff; }
.chart-area {
  background: #fafafa; position: relative; height: 320px; cursor: default;
}
svg { display: block; width: 100%; height: 100%; }
.data-pt { cursor: pointer; transition: r 0.15s; }
.data-pt:hover { r: 7; }
.excluded-pt { cursor: pointer; }
.footer {
  padding: 10px 16px; background: #1e1e36; display: flex; justify-content: space-between;
  align-items: center; font-size: 13px;
}
.toggle-count { color: #aaa; }
.toggle-count b { color: #ffbd2e; font-size: 15px; }
.status-msg {
  font-family: 'SF Mono', Menlo, monospace; font-size: 12px;
  min-height: 18px; transition: color 0.2s;
}
.refit-flash {
  color: #62c4ff;
}
.reset-btn {
  background: #3d3d5c; color: #ccc; border: 1px solid #555; border-radius: 4px;
  padding: 4px 12px; font-size: 12px; cursor: pointer;
}
.reset-btn:hover { background: #4d4d6c; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <span>Neutralization Curve Analysis</span>
  </div>
  <div class="instructions">
    Click any data point to <b>exclude</b> it from the fit. Click again to restore. Watch the curve refit.
  </div>
  <div class="chart-area" id="chart-area">
    <svg id="plot" viewBox="0 0 600 320"></svg>
  </div>
  <div class="footer">
    <div class="status-msg" id="status">Fitted curve shown. Start clicking points.</div>
    <div class="toggle-count">Exclusion decisions: <b id="toggle-num">0</b></div>
    <button class="reset-btn" id="reset-btn">Reset</button>
  </div>
</div>

<script>
(function() {
  'use strict';
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('plot');
  var statusEl = document.getElementById('status');
  var toggleNum = document.getElementById('toggle-num');

  var W = 600, H = 320;
  var M = { top: 15, right: 20, bottom: 35, left: 45 };
  var PW = W - M.left - M.right, PH = H - M.top - M.bottom;
  var xMin = 0.5, xMax = 8.5, yMin = -5, yMax = 105;

  function sx(x) { return M.left + (x - xMin) / (xMax - xMin) * PW; }
  function sy(y) { return M.top + (1 - (y - yMin) / (yMax - yMin)) * PH; }

  function f4pl(x, p) {
    var e = (p[2] - x) * p[3]; if (e > 100) e = 100; if (e < -100) e = -100;
    return p[0] + (p[1] - p[0]) / (1 + Math.pow(10, e));
  }

  // Data: 8 dilutions, one clear outlier, one borderline
  var trueParams = [5, 95, 4.5, 1.5];
  var xs = [1, 2, 3, 4, 5, 6, 7, 8];
  var ys = xs.map(function(x, i) {
    return f4pl(x, trueParams) + [1.2, -0.8, 2.1, -1.5, 0.9, -2.3, 1.1, -0.6][i];
  });
  // Clear outlier at index 4 (dilution 5)
  ys[4] += 45;
  // Borderline at index 3 (dilution 4, near EC50) — slightly high but plausible
  ys[3] += 8;

  var excluded = xs.map(function() { return false; });
  var toggleCount = 0;

  // Grid-search 4PL fitter
  function fit4pl(fxs, fys) {
    var best = [0, 100, 4.5, 1.0];
    var bestSSR = Infinity;
    var b0 = Math.min.apply(null, fys);
    var t0 = Math.max.apply(null, fys);
    for (var ec = 2; ec <= 7; ec += 0.2) {
      for (var h = 0.3; h <= 4; h += 0.2) {
        var ssr = 0;
        for (var i = 0; i < fxs.length; i++) {
          var r = fys[i] - f4pl(fxs[i], [b0, t0, ec, h]); ssr += r * r;
        }
        if (ssr < bestSSR) { bestSSR = ssr; best = [b0, t0, ec, h]; }
      }
    }
    return best;
  }

  function getActiveData() {
    var ax = [], ay = [];
    for (var i = 0; i < xs.length; i++) {
      if (!excluded[i]) { ax.push(xs[i]); ay.push(ys[i]); }
    }
    return { xs: ax, ys: ay };
  }

  var xGrid = [];
  for (var gx = xMin; gx <= xMax; gx += 0.1) xGrid.push(gx);

  function el(tag, attrs) {
    var e = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); }
    return e;
  }

  function pathFromParams(p) {
    var pts = [];
    for (var i = 0; i < xGrid.length; i++) {
      var y = Math.max(yMin, Math.min(yMax, f4pl(xGrid[i], p)));
      pts.push(sx(xGrid[i]).toFixed(1) + ',' + sy(y).toFixed(1));
    }
    return 'M' + pts.join(' L');
  }

  var curvePath;

  function buildStatic() {
    svg.appendChild(el('rect', { x: M.left, y: M.top, width: PW, height: PH, fill: '#fff', stroke: '#ddd' }));
    for (var x = 1; x <= 8; x++)
      svg.appendChild(el('line', { x1: sx(x), y1: M.top, x2: sx(x), y2: M.top + PH, stroke: '#f0f0f0' }));
    for (var y = 0; y <= 100; y += 20)
      svg.appendChild(el('line', { x1: M.left, y1: sy(y), x2: M.left + PW, y2: sy(y), stroke: '#f0f0f0' }));
    for (var xa = 1; xa <= 8; xa++) {
      var t = el('text', { x: sx(xa), y: M.top + PH + 16, 'text-anchor': 'middle', 'font-size': 10, fill: '#aaa' });
      t.textContent = xa; svg.appendChild(t);
    }
    for (var ya = 0; ya <= 100; ya += 20) {
      var t2 = el('text', { x: M.left - 6, y: sy(ya) + 3, 'text-anchor': 'end', 'font-size': 10, fill: '#aaa' });
      t2.textContent = ya; svg.appendChild(t2);
    }
    var xl = el('text', { x: M.left + PW / 2, y: H - 5, 'text-anchor': 'middle', 'font-size': 11, fill: '#999' });
    xl.textContent = 'log10(dilution)'; svg.appendChild(xl);
    var yl = el('text', { x: 12, y: M.top + PH / 2, 'text-anchor': 'middle', 'font-size': 11, fill: '#999', transform: 'rotate(-90, 12, ' + (M.top + PH / 2) + ')' });
    yl.textContent = '% neutralization'; svg.appendChild(yl);
  }

  function refit() {
    var active = getActiveData();
    var params = fit4pl(active.xs, active.ys);
    curvePath.setAttribute('d', pathFromParams(params));
    return params;
  }

  function getStatusMessage() {
    var excludedIndices = [];
    for (var i = 0; i < xs.length; i++) { if (excluded[i]) excludedIndices.push(i); }

    if (excludedIndices.length === 0) {
      return { text: 'All 8 points included. That outlier at dilution 5 is pulling the curve.', cls: '' };
    }
    if (excludedIndices.length === 1 && excludedIndices[0] === 4) {
      return { text: 'You excluded the obvious outlier at dilution 5. Good call. But what about dilution 4?', cls: '' };
    }
    if (excludedIndices.length === 2 && excludedIndices.indexOf(3) >= 0 && excludedIndices.indexOf(4) >= 0) {
      return { text: 'You excluded dilutions 4 and 5. Was dilution 4 really an outlier? Another analyst might disagree.', cls: 'refit-flash' };
    }
    if (excludedIndices.length >= 3) {
      return { text: excludedIndices.length + ' points excluded. Are you fitting data or writing fiction?', cls: 'refit-flash' };
    }
    if (excludedIndices.indexOf(3) >= 0 && excludedIndices.indexOf(4) < 0) {
      return { text: 'You excluded dilution 4 but kept the obvious outlier at 5. Interesting choice.', cls: 'refit-flash' };
    }
    return { text: excludedIndices.length + ' point(s) excluded. Curve refit.', cls: '' };
  }

  function drawPoints() {
    // Remove old points
    var old = svg.querySelectorAll('.data-pt, .excluded-pt, .excluded-x');
    old.forEach(function(e) { e.remove(); });

    for (var i = 0; i < xs.length; i++) {
      if (excluded[i]) {
        // Grayed out circle
        var c = el('circle', {
          cx: sx(xs[i]), cy: sy(ys[i]), r: 6,
          fill: '#ccc', stroke: '#999', 'stroke-width': 1,
          class: 'excluded-pt', 'data-idx': i
        });
        svg.appendChild(c);
        // Red X mark
        var x1 = sx(xs[i]) - 7, y1 = sy(ys[i]) - 7;
        var x2 = sx(xs[i]) + 7, y2 = sy(ys[i]) + 7;
        svg.appendChild(el('line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: '#ff5f57', 'stroke-width': 2.5, class: 'excluded-x' }));
        svg.appendChild(el('line', { x1: x2, y1: y1, x2: x1, y2: y2, stroke: '#ff5f57', 'stroke-width': 2.5, class: 'excluded-x' }));

        c.addEventListener('click', function(idx) {
          return function() { togglePoint(idx); };
        }(i));
      } else {
        var p = el('circle', {
          cx: sx(xs[i]), cy: sy(ys[i]), r: 5,
          fill: '#2196F3', stroke: '#fff', 'stroke-width': 2,
          class: 'data-pt', 'data-idx': i
        });
        svg.appendChild(p);

        p.addEventListener('click', function(idx) {
          return function() { togglePoint(idx); };
        }(i));
      }
    }
  }

  function togglePoint(idx) {
    excluded[idx] = !excluded[idx];
    toggleCount++;
    toggleNum.textContent = toggleCount;

    // Flash refit status
    statusEl.className = 'status-msg refit-flash';
    statusEl.textContent = 'Refitting...';
    // Brief delay to show the "refit" happening
    setTimeout(function() {
      refit();
      drawPoints();
      var msg = getStatusMessage();
      statusEl.className = 'status-msg ' + msg.cls;
      statusEl.textContent = msg.text;
    }, 300);
  }

  // Init
  buildStatic();
  var initParams = fit4pl(xs, ys);
  curvePath = el('path', { d: pathFromParams(initParams), fill: 'none', stroke: '#555', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  svg.appendChild(curvePath);
  drawPoints();

  // Reset button
  document.getElementById('reset-btn').addEventListener('click', function() {
    excluded = xs.map(function() { return false; });
    toggleCount = 0;
    toggleNum.textContent = '0';
    refit();
    drawPoints();
    statusEl.className = 'status-msg';
    statusEl.textContent = 'Reset. All 8 points included.';
  });
})();
</script>
</body>
</html>
