<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qubit Measurement</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: monospace; font-size: 13px; line-height: 1.5;
    background: #fff; color: #222;
  }
  .card {
    background: #fafafa; border: 1px solid #ddd; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    max-width: 640px; margin: 0 auto; padding: 16px;
  }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .qsel { display: flex; gap: 6px; margin: 4px 0 10px; }
  .qsel button {
    font-family: monospace; font-size: 12px; padding: 6px 12px;
    border: 1px solid #0066cc; border-radius: 6px; background: #fff; color: #0066cc; cursor: pointer;
  }
  .qsel button.active { background: #0066cc; color: #fff; }
  label.slider-label { font-weight: bold; color: #0066cc; min-width: 96px; }
  input[type="range"] { flex: 1; min-width: 160px; accent-color: #0066cc; }
  .pval { font-weight: bold; min-width: 70px; color: #222; }
  button.act {
    font-family: monospace; font-size: 13px; padding: 6px 12px;
    border: 1px solid #0066cc; border-radius: 4px; background: #fff; color: #0066cc; cursor: pointer;
  }
  button.act:hover { background: #0066cc; color: #fff; }
  button.reset { border-color: #e85d3a; color: #e85d3a; }
  button.reset:hover { background: #e85d3a; color: #fff; }
  #sliders { margin: 4px 0 8px; }
  .hist {
    display: flex; align-items: flex-end; justify-content: center; gap: 10px;
    height: 180px; padding: 12px 8px 0; margin: 10px 0 8px;
    background: #fff; border: 1px solid #eee; border-radius: 6px;
  }
  .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; flex: 1 1 0; min-width: 0; }
  .bar { width: 80%; max-width: 46px; transition: height 0.25s ease; border-radius: 4px 4px 0 0; background: #0066cc; }
  .bar.empty { background: #d9d9d9; }
  .bar-label { margin-top: 6px; font-weight: bold; font-size: 12.5px; color: #222; }
  .bar-count { font-size: 11.5px; color: #555; }
  .bar-theory { font-size: 11px; color: #999; }
  .readout { margin: 8px 0; padding: 8px 10px; background: #e7f6ee; border: 1px solid #bfe6d1; border-radius: 4px; color: #1a9e5b; font-size: 13px; }
  .caption { margin-top: 10px; padding: 8px 10px; font-size: 11.5px; color: #555; border-top: 1px dashed #ddd; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="qsel" id="qsel">
    <button data-n="1">1 qubit</button>
    <button data-n="2">2 qubits</button>
    <button data-n="3">3 qubits</button>
  </div>
  <div id="sliders"></div>
  <div class="row">
    <button class="act" id="btnOnce">Measure once</button>
    <button class="act" id="btnHundred">Measure 100&times;</button>
    <button class="act reset" id="btnReset">Reset</button>
  </div>
  <div class="hist" id="hist"></div>
  <div class="readout" id="readout">samples: 0</div>
  <div class="caption">n qubits span 2<sup>n</sup> joint outcomes. Each measurement yields one bitstring; measure many times and the joint distribution emerges. Switch between 1, 2, and 3 qubits and watch the space double, then double again.</div>
</div>
<script>
(function () {
  'use strict';

  function fit() {
    var f = window.frameElement;
    if (!f) return;
    f.style.height = '0px';
    f.style.height = document.body.scrollHeight + 'px';
  }

  var MAX_PX = 140;
  var state = { n: 1, biases: [0.7], counts: {} };

  var qsel = document.getElementById('qsel');
  var slidersEl = document.getElementById('sliders');
  var histEl = document.getElementById('hist');
  var readout = document.getElementById('readout');

  function binLabels(n) {
    var arr = [];
    var total = 1 << n;
    for (var i = 0; i < total; i++) {
      arr.push(i.toString(2).padStart(n, '0'));
    }
    return arr;
  }

  function theoretical(bs) {
    var t = 1;
    for (var j = 0; j < bs.length; j++) {
      t *= (bs[j] === '1') ? state.biases[j] : (1 - state.biases[j]);
    }
    return t;
  }

  function totalSamples() {
    var s = 0;
    for (var k in state.counts) s += state.counts[k];
    return s;
  }

  function measure(times) {
    for (var t = 0; t < times; t++) {
      var bs = '';
      for (var j = 0; j < state.n; j++) {
        bs += (Math.random() < state.biases[j]) ? '1' : '0';
      }
      state.counts[bs] = (state.counts[bs] || 0) + 1;
    }
    render();
  }

  function resetCounts() {
    state.counts = {};
    render();
  }

  function setN(n) {
    state.n = n;
    var b = [];
    for (var j = 0; j < n; j++) b[j] = (state.biases[j] !== undefined) ? state.biases[j] : 0.7;
    state.biases = b;
    state.counts = {};
    buildSliders();
    syncQsel();
    render();
  }

  function syncQsel() {
    var btns = qsel.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-n'), 10) === state.n);
    }
  }

  function buildSliders() {
    slidersEl.innerHTML = '';
    for (var j = 0; j < state.n; j++) {
      (function (jj) {
        var row = document.createElement('div');
        row.className = 'row';
        var lab = document.createElement('label');
        lab.className = 'slider-label';
        lab.textContent = 'qubit ' + (jj + 1) + ' bias:';
        var inp = document.createElement('input');
        inp.type = 'range'; inp.min = '0'; inp.max = '1'; inp.step = '0.01';
        inp.value = String(state.biases[jj]);
        var val = document.createElement('span');
        val.className = 'pval';
        val.textContent = 'p = ' + state.biases[jj].toFixed(2);
        inp.addEventListener('input', function () {
          state.biases[jj] = parseFloat(inp.value);
          val.textContent = 'p = ' + state.biases[jj].toFixed(2);
          render();
        });
        row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
        slidersEl.appendChild(row);
      })(j);
    }
  }

  function render() {
    var labels = binLabels(state.n);
    var maxCount = 0;
    for (var i = 0; i < labels.length; i++) {
      var c = state.counts[labels[i]] || 0;
      if (c > maxCount) maxCount = c;
    }
    histEl.innerHTML = '';
    for (var k = 0; k < labels.length; k++) {
      var bs = labels[k];
      var count = state.counts[bs] || 0;
      var h = (maxCount > 0) ? Math.round((count / maxCount) * MAX_PX) : 0;
      var col = document.createElement('div');
      col.className = 'bar-col';
      var bar = document.createElement('div');
      bar.className = 'bar' + (count === 0 ? ' empty' : '');
      bar.style.height = h + 'px';
      col.appendChild(bar);
      var lbl = document.createElement('div');
      lbl.className = 'bar-label';
      lbl.textContent = bs;
      col.appendChild(lbl);
      var cn = document.createElement('div');
      cn.className = 'bar-count';
      cn.textContent = String(count);
      col.appendChild(cn);
      var th = document.createElement('div');
      th.className = 'bar-theory';
      th.textContent = (theoretical(bs) * 100).toFixed(0) + '%';
      col.appendChild(th);
      histEl.appendChild(col);
    }
    var total = totalSamples();
    readout.textContent = 'samples: ' + total + '  ·  2^' + state.n + ' = ' + labels.length + ' possible joint outcomes';
    fit();
  }

  qsel.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setN(parseInt(btn.getAttribute('data-n'), 10));
    });
  });
  document.getElementById('btnOnce').addEventListener('click', function () { measure(1); });
  document.getElementById('btnHundred').addEventListener('click', function () { measure(100); });
  document.getElementById('btnReset').addEventListener('click', resetCounts);

  syncQsel();
  buildSliders();
  render();
  fit();
  window.addEventListener('load', fit);
})();
</script>
</body>
</html>
