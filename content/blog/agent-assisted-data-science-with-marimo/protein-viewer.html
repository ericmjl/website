<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #viewer { width: 100%; height: 440px; position: relative; background: #ffffff; }
  #status {
    position: absolute; top: 8px; left: 12px;
    font-family: "Berkeley Mono", ui-monospace, monospace;
    font-size: 12px; color: #666;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.0/3Dmol-min.js"></script>
</head>
<body>
<div id="viewer"><div id="status">loading ubiquitin (1UBQ)...</div></div>
<script>
  (function () {
    var el = document.getElementById("viewer");
    var status = document.getElementById("status");
    var viewer = $3Dmol.createViewer(el, { backgroundColor: "white" });
    fetch("https://files.rcsb.org/download/1UBQ.pdb")
      .then(function (r) { return r.text(); })
      .then(function (data) {
        viewer.addModel(data, "pdb");
        viewer.setStyle({}, { cartoon: { colorscheme: "spectrum" } });
        viewer.zoomTo();
        viewer.render();
        viewer.resize();
        status.textContent = "ubiquitin, PDB 1UBQ \u00b7 drag to rotate, scroll to zoom";
      })
      .catch(function () {
        status.textContent = "could not load 1UBQ.pdb from rcsb.org";
      });
  })();
</script>
</body>
</html>
